    - ID: "f7d8e9f0-a1b2-4c3d-4e5f-6a7b8c9d0e1f"
      Hint: Copy
      Value: |
        <div class="ck-content"><p>Atrial fibrillation is an irregular heartbeat, or arrhythmia. Atrial fibrillation, also known as AFib or AF, can lead to blood clots, stroke, heart failure and other heart-related complications.</p></div>
