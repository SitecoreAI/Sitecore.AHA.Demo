      Hint: Text
      Value: |
        <div class="ck-content"><p>Healthy eating is about your habits over time, not just one meal. Over time, load up on fruits, veggies, and whole grains. Choose healthy proteins like beans, nuts, fish, lean meats, and low-fat dairy. Cook with heart-healthy oils like olive or canola, cut back on sugar and salt, keep alcohol to a minimum, and choose minimally processed foods whenever possible.<br />&nbsp;</p></div>
