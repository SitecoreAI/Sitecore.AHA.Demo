      Hint: Subtitle
      Value: "What is Cholesterol?"
    - ID: "f7d8e9f0-a1b2-4c3d-4e5f-6a7b8c9d0e1f"
      Hint: Copy
      Value: |
        <div class="ck-content"><p>Cholesterol is a waxy substance found throughout the body. It's not <i>bad</i> unless you have too much of it. In fact, your body needs it to build cells. But too much cholesterol can pose a problem.</p></div>
